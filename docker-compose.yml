version: "3.9"

services:
  app:
    build: .
    image: docker-cicd-pipeline:local
    container_name: docker-cicd-pipeline
    ports:
      - "5000:5000"
    environment:
      - APP_VERSION=1.0.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 3s
      retries: 3